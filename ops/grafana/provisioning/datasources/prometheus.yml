apiVersion: 1

datasources:
  - name: Prometheus
    # Pinned uid: the dashboard JSON references this datasource by uid, so a
    # Grafana-generated random uid would make the checked-in dashboard load
    # with every panel showing "datasource not found" on a fresh install.
    uid: llmobs-prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    jsonData:
      # Must match `scrape_interval` in ops/prometheus/prometheus.yml, or
      # Grafana picks a `$__rate_interval` that silently smooths away the
      # short spikes the incident case study is built on.
      timeInterval: 5s
      httpMethod: POST
