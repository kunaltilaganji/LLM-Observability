# Containerised equivalent of scripts/stack.sh.
#
# ⚠️  NOT EXERCISED. The host this project was built on grants no Docker access
# (no `docker` group, no passwordless sudo), so this file has never been run.
# It is included for portability and is written to match the configuration that
# `scripts/stack.sh` actually starts -- but treat it as a starting point, not a
# tested artefact. `scripts/stack.sh` is the path with evidence behind it.
#
# Two things will need attention on a machine that can run this:
#   - the service reaches Ollama on the *host*, not in the compose network
#   - GPU access requires the NVIDIA container runtime, and the VRAM metric
#     needs the device index the model actually lands on (scripts/detect_gpu.py)

services:
  phoenix:
    image: arizephoenix/phoenix:version-19.19.1
    ports:
      - "6006:6006"    # UI + OTLP/HTTP trace ingest
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix-data:/data

  prometheus:
    image: prom/prometheus:v3.13.2
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    # The scrape target in prometheus.yml is localhost:8100, which inside a
    # container is the container itself. Override it here rather than editing
    # the file the no-Docker path also reads.
    extra_hosts:
      - "localhost:host-gateway"

  grafana:
    image: grafana/grafana-oss:13.1.3
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      LLMOBS_DASHBOARD_DIR: /var/lib/grafana/dashboards
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  service:
    build:
      context: ..
      dockerfile: ops/Dockerfile
    ports:
      - "8100:8100"
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
      OTEL_EXPORTER_OTLP_ENDPOINT: http://phoenix:6006/v1/traces
      SLM_REPO: /opt/offline-slm-assistant
      LLMOBS_GPU_INDEX: "0"   # verify with scripts/detect_gpu.py on the target host
    volumes:
      - ../../offline-slm-assistant:/opt/offline-slm-assistant:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - phoenix
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  phoenix-data:
  prometheus-data:
  grafana-data:
